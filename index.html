<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Интерактивная логопедическая игра для детей — тренировка звука [Ч]">
    <title>Манул-экспресс: Звук [Ч]</title>
    
    <!-- Подключение шрифта Ubuntu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Подключение стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container" id="gameContainer">
        
        <!-- Игровая сцена -->
        <section class="scene" id="scene">
            
            <!-- Слой фона (меняется на каждом уровне) -->
            <div class="background-layer" id="bgLayer">
                <img src="img/bg_kreml.png" alt="Фон уровня" class="bg-image active" id="bgImg">
            </div>
            
            <!-- Рельсы -->
            <div class="tracks">
                <div class="track-line"></div>
                <div class="track-sleepers"></div>
            </div>

            <!-- Поезд из картинки -->
            <div class="train-wrapper" id="trainWrapper">
                <img src="img/poezd.png" alt="Поезд Манула" class="train-image" id="trainImage">
                <div class="smoke" id="smoke"></div>
            </div>

            <!-- Финальный оверлей с достопримечательностью -->
            <div class="final-overlay" id="finalOverlay">
                <div class="final-card">
                    <div class="final-image-wrapper">
                        <img src="" alt="" class="final-image" id="finalImage">
                        <div class="final-glow"></div>
                    </div>
                    <div class="final-info">
                        <h2 class="final-title" id="finalTitle"></h2>
                        <p class="final-description" id="finalDescription"></p>
                    </div>
                    <button class="btn btn-restart" id="restartBtn">Играть снова</button>
                </div>
            </div>
        </section>

        <!-- UI слой -->
        <section class="ui-layer">
            
            <!-- Карточка с инструкцией -->
            <div class="instruction-card" id="instructionCard">
                <h2>Вокруг света</h2>
                <p>
                    Манул отправился в путешествие по железной дороге. 
                    Помоги ему доехать: чтобы поезд ехал, 
                    подними язычок к верхним зубам в форме «чашечки», 
                    набери воздух и <strong>удерживай кнопку</strong>, 
                    чтобы произнести [Ч-Ч-Ч] и разогнать поезд!
                </p>
                <button class="btn btn-primary" id="startBtn">Поехали!</button>
            </div>

            <!-- Зона действия (кнопка «Дуй») -->
            <div class="action-zone" id="actionZone" style="display: none;">
                <button class="blow-button" id="blowBtn">
                    <span class="blow-icon">💨</span>
                    <span class="blow-text">Дуй! [Ч-Ч-Ч]</span>
                </button>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Подключение логики игры -->
    <script src="game.js"></script>
</body>
</html>
