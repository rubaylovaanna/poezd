<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Интерактивная логопедическая игра для детей — тренировка звука [Ч]">
    <title>Манул-экспресс: Звук [Ч]</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container" id="gameContainer">
        
        <!-- Игровая сцена -->
        <section class="scene" id="scene">
            <div class="background-layer" id="bgLayer">
                <img src="img/bg_kreml.png" alt="Фон уровня" class="bg-image active" id="bgImg">
            </div>
            
            <div class="tracks">
                <div class="track-line"></div>
                <div class="track-sleepers"></div>
            </div>

            <div class="train-wrapper" id="trainWrapper">
                <img src="img/poezd.png" alt="Поезд Манула" class="train-image" id="trainImage">
                <div class="smoke" id="smoke"></div>
            </div>
        </section>

        <!-- UI слой -->
        <section class="ui-layer">
            <div class="start-zone" id="startZone">
                <button class="btn btn-primary" id="startBtn">Начать игру</button>
            </div>

            <div class="action-zone" id="actionZone" style="display: none;">
                <button class="blow-button" id="blowBtn">
                    <span class="blow-icon">💨</span>
                    <span class="blow-text">Дуй! [Ч-Ч-Ч]</span>
                </button>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- СТАРТОВЫЙ ПОПАП -->
    <div class="popup__bg" id="startPopupBg">
        <div class="popup" id="startPopup">
            <button class="close-popup" id="closeStartPopup">&times;</button>
            <div class="popup-content">
                <img src="img/poezd.png" alt="Поезд" class="popup-image">
                <h2 class="popup-title">Вокруг света</h2>
                <p class="popup-text">
                    Манул отправился в путешествие по железной дороге. 
                    Помоги ему доехать: чтобы поезд ехал, 
                    подними язычок к верхним зубам в форме «чашечки», 
                    набери воздух и <strong>удерживай кнопку</strong>, 
                    чтобы произнести [Ч-Ч-Ч] и разогнать поезд!
                </p>
                <button class="btn btn-primary" id="startPopupOk">ОК, поехали!</button>
            </div>
        </div>
    </div>

    <!-- ПОПАП С ДОСТОПРИМЕЧАТЕЛЬНОСТЬЮ -->
    <div class="popup__bg" id="landmarkPopupBg">
        <div class="popup" id="landmarkPopup">
            <button class="close-popup" id="closeLandmarkPopup">&times;</button>
            <div class="popup-content">
                <img src="" alt="" class="popup-image" id="landmarkImage">
                <h2 class="popup-title" id="landmarkTitle"></h2>
                <p class="popup-text" id="landmarkDescription"></p>
                <button class="btn btn-primary" id="landmarkOk">Продолжить путешествие</button>
            </div>
        </div>
    </div>

    <!-- ФИНАЛЬНЫЙ ПОПАП -->
    <div class="popup__bg" id="finalPopupBg">
        <div class="popup" id="finalPopup">
            <button class="close-popup" id="closeFinalPopup">&times;</button>
            <div class="popup-content">
                <img src="" alt="" class="popup-image" id="finalImage">
                <h2 class="popup-title" id="finalTitle">🎉 Путешествие завершено!</h2>
                <p class="popup-text" id="finalDescription"></p>
                <button class="btn btn-primary" id="finalOk">Играть снова</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
